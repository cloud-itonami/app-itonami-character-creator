name: oracle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  oracle-test:
    name: oracle (reference only) — clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: oracle notice
        run: echo "ORACLE job - reference measurement only, not a gate, not a required check, no native build or gate depends on it (AGENTS.md CI exception, JUN-579)."
      # Deps come from the kotoba monorepo (git pins in deps.edn), which is
      # self-contained: no :local/root sibling checkouts are needed. (The
      # sibling checkouts for the deleted kotoba-lang/{org-vrmc-vrm,character,
      # spec} repos were removed with the stage-2 monorepo migration.)
      - name: Checkout kami-app-character-creator
        uses: actions/checkout@v4
        with:
          path: work/orgs/kotoba-lang/kami-app-character-creator

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('work/orgs/kotoba-lang/kami-app-character-creator/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ matrix.java }}-clj-

      - name: Run tests
        working-directory: work/orgs/kotoba-lang/kami-app-character-creator
        run: clojure -M:test

      - name: Lint (clj-kondo)
        working-directory: work/orgs/kotoba-lang/kami-app-character-creator
        run: clojure -M:lint
